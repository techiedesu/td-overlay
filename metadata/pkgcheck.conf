# QA policy for this repo, picked up automatically by `pkgcheck scan` run from
# inside the checkout and by pkgcore/pkgcheck-action in CI.
# The section name is the repo id from profiles/repo_name. See pkgcheck(1),
# "CONFIG FILE SUPPORT" — keys are the long options of `pkgcheck scan`, and
# values must stay on one line (continuation lines end up inside the value).
#
# -NonsolvableDepsInDev: every package here is a prebuilt, glibc-linked upstream
#   binary, so sys-libs/glibc is unsolvable on the musl dev profiles by
#   construction. NonsolvableDepsInStable stays enabled; that is the gate that
#   matters for users of this overlay.
# -RedundantVersion: version bumps of the binary channels are symlinks to the
#   newest real ebuild on purpose, so older versions are redundant by design.
[td]
keywords = -NonsolvableDepsInDev,-RedundantVersion
